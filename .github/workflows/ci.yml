name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # La suite corre con SQLite en memoria y variables de entorno dummy
        # (tests/jest.setup.env.js), sin necesidad de un .env ni servicios externos.
        run: npm test
        env:
          NODE_ENV: test
